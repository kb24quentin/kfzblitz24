services:
  werkstattconnect-db:
    image: postgres:16-alpine
    container_name: werkstattconnect_db_staging
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      POSTGRES_USER: werkstattconnect
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: werkstattconnect
    volumes:
      - /opt/kfzblitz24/data/staging/werkstattconnect-postgres:/var/lib/postgresql/data
    networks:
      - staging_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werkstattconnect -d werkstattconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  werkstattconnect:
    build:
      context: .
      dockerfile: Dockerfile
    image: kfzblitz24/werkstattconnect:staging
    container_name: werkstattconnect_staging
    restart: unless-stopped
    depends_on:
      werkstattconnect-db:
        condition: service_healthy
    environment:
      TZ: Europe/Berlin
      DATABASE_URL: postgresql://werkstattconnect:${DB_PASSWORD}@werkstattconnect-db:5432/werkstattconnect
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: https://connect.staging.kfzblitz24-group.com
      NEXTAUTH_URL: https://connect.staging.kfzblitz24-group.com
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL}
      FROM_NAME: ${FROM_NAME:-WerkstattConnect}
      GOOGLE_SSO_CLIENT_ID: ${GOOGLE_SSO_CLIENT_ID}
      GOOGLE_SSO_CLIENT_SECRET: ${GOOGLE_SSO_CLIENT_SECRET}
      SSO_ALLOWED_DOMAIN: ${SSO_ALLOWED_DOMAIN:-kfzblitz24.de}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-quentin.leopold@kfzblitz24.de}
    networks:
      - staging_internal
      - traefik_net
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_net
      - traefik.http.routers.werkstattconnect-staging.rule=Host(`connect.staging.kfzblitz24-group.com`)
      - traefik.http.routers.werkstattconnect-staging.entrypoints=websecure
      - traefik.http.routers.werkstattconnect-staging.tls=true
      - traefik.http.routers.werkstattconnect-staging.tls.certresolver=letsencrypt
      - traefik.http.services.werkstattconnect-staging.loadbalancer.server.port=3000

networks:
  staging_internal:
    external: true
  traefik_net:
    external: true
